<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>A1 透天 3D 家具搭配</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: full-bleed 3D stage; floating control rail at left, furniture editor sheet at right (bottom sheet on phones). Single dark look, warm-light accent. */
:root{
  --bg:#141412; --panel:rgba(24,23,21,.86); --panel-solid:#1B1A18; --line:#3A3835; --fg:#F2F0EB; --muted:#B3AEA5; --dim:#7F7A72;
  --accent:#F0B66A; --accent-ink:#1B1A18; --ok:#8FBF8A; --warn:#E8A15A;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{font:500 12px/1.2 var(--body);color:var(--fg);background:rgba(20,20,18,.72);padding:3px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));width:300px;max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px;padding:18px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:700}
h1{margin:4px 0 0;font:700 24px/1.25 var(--display);text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts b{font:700 17px/1.1 var(--display)}
.facts span{font-size:11px;color:var(--muted)}
.sect{display:flex;flex-direction:column;gap:8px}
.sect>h2{margin:0;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.12em}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:9px 0;font-size:13px;font-weight:700;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#26241F;border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:13px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.note{margin:0;font-size:12px;line-height:1.6;color:var(--dim)}
.sheet{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:360px;max-height:calc(100% - 32px);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font:700 18px/1.2 var(--display)}
.sheet-body{overflow:auto;padding:12px 18px 18px;display:flex;flex-direction:column;gap:14px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px}
.item:hover .iname{color:var(--accent)}
.item[aria-current="true"] .iname{color:var(--accent)}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.iname{font-size:14px;font-weight:700}
.isub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iroom{font-size:11px;color:var(--dim)}
.editor{display:flex;flex-direction:column;gap:12px}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);padding:0;font-size:13px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;background:#211F1C;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:#2A2620}
.opt .on{font-size:14px;font-weight:700}
.opt .os{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.brand{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.b-ikea{background:#0058A3;color:#FFDB00}
.b-tr{background:#C8102E;color:#fff}
.b-gen{background:#4A4844;color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;font-size:11px;color:var(--muted);width:56px}
.sw i{display:block;width:40px;height:40px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sw[aria-pressed="true"] i{border-color:var(--accent)}
.sw[aria-pressed="true"]{color:var(--fg)}
.fit{font-size:13px;line-height:1.55;padding:9px 11px;border-radius:8px;background:#211F1C;border:1px solid var(--line)}
.fit.ok b{color:var(--ok)} .fit.warn b{color:var(--warn)}
.tip{font-size:13px;line-height:1.65;color:var(--muted);margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.theme{display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;background:#211F1C;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px}
.theme .tn{font-size:14px}
.theme small{color:var(--muted);font-size:11.5px;line-height:1.45}
.theme[aria-pressed="true"]{border-color:var(--accent)}
.theme span{display:flex;gap:3px}
.theme span i{width:14px;height:14px;border-radius:3px;display:block}
dialog{background:var(--panel-solid);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:min(560px,calc(100% - 32px));padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{display:flex;flex-direction:column;gap:12px;padding:20px}
.dlg h2{margin:0;font:700 20px var(--display)}
.dlg pre{margin:0;max-height:50vh;overflow:auto;background:#141412;border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.7 var(--body);white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.loading{position:fixed;inset:0;display:grid;place-items:center;font:500 15px var(--body);color:var(--muted);pointer-events:none}
.fab{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:99px;padding:10px 16px;font-size:14px;font-weight:700;color:var(--fg)}
.fab:hover{border-color:var(--accent)}
.fab b{color:var(--accent)}
.fab-l{left:16px}.fab-r{right:16px}
.panel-x{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.panel-x:hover{border-color:var(--accent);color:var(--fg)}
.rail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.head-btns{display:flex;gap:8px}
@media (max-width:820px){.fab{top:calc(12px + env(safe-area-inset-top,0px));padding:9px 14px}.fab-l{left:12px}.fab-r{right:12px}}
.hidden-mobile{}
@media (max-width:820px){
  .rail{left:12px;right:12px;width:auto;top:calc(12px + env(safe-area-inset-top,0px));max-height:none;padding:12px;gap:10px}
  .rail .hidden-mobile{display:none}
  h1{font-size:18px}
  .sheet{left:12px;right:12px;width:auto;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:44%}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .chip{flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div id="stage"></div>
<div id="labels"></div>
<div class="loading" id="loading">載入 3D 模型中…</div>

<button class="fab fab-l" id="openRail" aria-controls="rail">檢視 <b id="fabFloor">全棟</b></button>
<button class="fab fab-r" id="openSheet" aria-controls="sheet">家具搭配</button>
<aside class="rail" id="rail" aria-label="檢視控制" hidden>
  <div class="rail-top">
    <div>
      <div class="eyebrow">A1 透天 · 全棟 3D</div>
      <h1>暖灰、胡桃木與光</h1>
    </div>
    <button class="panel-x" id="closeRail" aria-label="收起檢視面板">收起</button>
  </div>
  <div class="facts hidden-mobile" aria-label="面積">
    <div><b>24.83</b><span>登記地坪（坪）</span></div>
    <div><b>52.39</b><span>登記建坪（坪）</span></div>
    <div><b>46.96</b><span>主建物（坪）</span></div>
  </div>
  <div class="sect">
    <h2>樓層</h2>
    <div class="seg" id="floors" role="group" aria-label="選擇樓層">
      <button data-f="all" aria-pressed="true">全棟</button>
      <button data-f="1" aria-pressed="false">1F</button>
      <button data-f="2" aria-pressed="false">2F</button>
      <button data-f="3" aria-pressed="false">3F</button>
      <button data-f="4" aria-pressed="false">4F</button>
    </div>
  </div>
  <div class="sect">
    <h2>模擬視角</h2>
    <div class="chips" id="views"></div>
  </div>
  <div class="sect">
    <h2>顯示</h2>
    <div class="toggles">
      <button class="chip" id="tCut" aria-pressed="true">剖切牆面</button>
      <button class="chip" id="tNight" aria-pressed="false">夜間燈光</button>
      <button class="chip" id="tLabel" aria-pressed="true">空間名稱</button>
    </div>
  </div>
  <p class="note hidden-mobile">右上「家具搭配」可換款式；點畫面中的家具也會打開。依原建商「傢俱配置參考圖」與 2021 毛胚屋影片建模，牆面與家具為比例示意，下單前請實際丈量。拖曳旋轉、滾輪縮放、右鍵或雙指平移；點家具可直接更換。</p>
</aside>

<section class="sheet" id="sheet" aria-label="家具搭配" hidden>
  <div class="sheet-head">
    <h2 id="sheetTitle">家具搭配</h2>
    <div class="head-btns"><button class="ghost" id="btnList">購物清單</button><button class="panel-x" id="closeSheet" aria-label="收起家具面板">收起</button></div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<dialog id="dlg">
  <div class="dlg">
    <h2>我的家具清單</h2>
    <pre id="listText"></pre>
    <p class="tip">尺寸為參考值，型號、顏色與價格以 IKEA 台灣及特力屋官網為準。</p>
    <div class="row">
      <button class="ghost" id="btnCopy">複製清單</button>
      <button class="primary" id="btnClose">關閉</button>
    </div>
  </div>
</dialog>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

/* ---------- 基本尺寸（公尺，x：鄰棟牆→側窗，z：車庫口→後院） ---------- */
const W=4.6, FZ=0.9, REAR=9.87;
const Y={1:0,2:3.6,3:6.9,4:10.2,5:13.5}, H={1:3.6,2:3.3,3:3.3,4:3.3};
const CORE={x0:2.14,x1:4.6,z0:4.28,z1:6.58};
const LX=[2.19,3.35], RX=[3.42,4.55];

/* ---------- renderer ---------- */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.localClippingEnabled=true;
stage.appendChild(renderer.domElement);
const labelR=new CSS2DRenderer({element:document.getElementById('labels')});
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),0.04).texture;
const camera=new THREE.PerspectiveCamera(42,1,0.05,200);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.maxPolarAngle=Math.PI*0.495;

const hemi=new THREE.HemisphereLight(0xF4F1EA,0x6E6A62,0.55); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xFFF2DE,2.4);
sun.position.set(9,22,10); sun.target.position.set(2.3,6,-5);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
Object.assign(sun.shadow.camera,{left:-12,right:12,top:14,bottom:-14,near:1,far:60});
scene.add(sun,sun.target);

/* ---------- 材質 ---------- */
const ALL=new Set(); let clipOn=true; const clipPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),99);
function reg(mat){ALL.add(mat); if(clipOn) mat.clippingPlanes=[clipPlane]; return mat;}
function mat(color,o={}){return reg(new THREE.MeshStandardMaterial({color,roughness:o.r??0.82,metalness:o.mt??0,...(o.x||{})}));}
function ctex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;}
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
const TX={
  oak:ctex(512,512,(g,w,h)=>{const r=rng(7);for(let y=0;y<h;y+=64){let x=-r()*200;while(x<w){const L=200+r()*220;const v=180+r()*22;g.fillStyle=`rgb(${v+10},${v-12},${v-40})`;g.fillRect(x,y,L,64);g.fillStyle='rgba(90,60,30,.10)';for(let i=0;i<9;i++)g.fillRect(x,y+r()*64,L,1);g.fillStyle='rgba(60,40,20,.35)';g.fillRect(x,y,2,64);x+=L;}g.fillStyle='rgba(60,40,20,.3)';g.fillRect(0,y,w,2);}}),
  tile:ctex(256,256,(g,w,h)=>{g.fillStyle='#D9D4CB';g.fillRect(0,0,w,h);const r=rng(3);for(let i=0;i<300;i++){g.fillStyle=`rgba(120,110,100,${r()*.06})`;g.fillRect(r()*w,r()*h,3,3);}g.fillStyle='#B9B3A9';g.fillRect(0,0,w,3);g.fillRect(0,0,3,h);}),
  tileDark:ctex(256,256,(g,w,h)=>{g.fillStyle='#6F6C67';g.fillRect(0,0,w,h);const r=rng(9);for(let i=0;i<400;i++){g.fillStyle=`rgba(255,255,255,${r()*.05})`;g.fillRect(r()*w,r()*h,4,2);}g.fillStyle='#55524E';g.fillRect(0,0,w,3);g.fillRect(0,0,3,h);}),
  garage:ctex(256,256,(g,w,h)=>{g.fillStyle='#8E8A84';g.fillRect(0,0,w,h);const r=rng(5);for(let i=0;i<500;i++){g.fillStyle=`rgba(40,40,40,${r()*.08})`;g.fillRect(r()*w,r()*h,3,3);}g.fillStyle='#74716C';g.fillRect(0,0,w,3);g.fillRect(0,0,3,h);}),
  grille:ctex(256,64,(g,w,h)=>{g.fillStyle='#6B4A33';g.fillRect(0,0,w,h);const r=rng(11);for(let i=0;i<40;i++){g.fillStyle=`rgba(40,25,15,${r()*.25})`;g.fillRect(r()*w,0,1,h);}for(let i=0;i<4;i++){g.fillStyle='#2A1C12';g.fillRect(i*64+52,0,12,h);}}),
  grilleLight:ctex(256,64,(g,w,h)=>{g.fillStyle='#E3CDAA';g.fillRect(0,0,w,h);const r=rng(17);for(let i=0;i<40;i++){g.fillStyle=`rgba(150,110,70,${r()*.18})`;g.fillRect(r()*w,0,1,h);}for(let i=0;i<4;i++){g.fillStyle='#A68562';g.fillRect(i*64+54,0,10,h);}}),
  marble:ctex(512,512,(g,w,h)=>{g.fillStyle='#ECE9E3';g.fillRect(0,0,w,h);const r=rng(21);g.strokeStyle='rgba(120,115,110,.35)';for(let i=0;i<9;i++){g.lineWidth=.6+r()*1.6;g.beginPath();let x=r()*w,y=0;g.moveTo(x,y);while(y<h){x+=(r()-.5)*60;y+=30+r()*40;g.lineTo(x,y);}g.stroke();}}),
  deck:ctex(256,256,(g,w,h)=>{for(let x=0;x<w;x+=32){const v=120+(x*7%30);g.fillStyle=`rgb(${v+20},${v-10},${v-40})`;g.fillRect(x,0,30,h);g.fillStyle='#3A2A1D';g.fillRect(x+30,0,2,h);}}),
  mc:ctex(512,512,(g,w,h)=>{g.fillStyle='#CBC6BE';g.fillRect(0,0,w,h);const r=rng(13);for(let i=0;i<60;i++){const x=r()*w,y=r()*h,rad=20+r()*90;const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,`rgba(${r()<.5?150:225},${r()<.5?145:220},140,.10)`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-rad,y-rad,rad*2,rad*2);}}),
};
const FLOORS=[], GRILLES=[];
function tiled(t,tile,w,d,o={}){const c=t.clone();c.needsUpdate=true;c.repeat.set(w/tile,d/tile);const m=mat(o.color??0xffffff,{r:o.r??0.75,x:{map:c}});if(t===TX.oak)FLOORS.push({m,w,d});return m;}
const M={
  plaster:mat(0xEDEAE4,{r:.92}), mc:null, black:mat(0x1E1D1B,{r:.45,mt:.4}), stone:mat(0xA4A19B,{r:.9}),
  walnut:mat(0x5E412D,{r:.6}), glass:reg(new THREE.MeshPhysicalMaterial({color:0xBFD3DC,roughness:.05,metalness:0,transmission:0,transparent:true,opacity:.22,depthWrite:false})),
  white:mat(0xF3F1EC,{r:.5}), ceil:mat(0xF6F4EF,{r:.95}), greige:mat(0xBDB6AB,{r:.55}), slab:mat(0x9A968F,{r:.9}),
  glow:reg(new THREE.MeshStandardMaterial({color:0xFFE7C2,emissive:0xFFC77A,emissiveIntensity:1.2})),
  strip:reg(new THREE.MeshStandardMaterial({color:0xFFF8EE,emissive:0xFFF1DC,emissiveIntensity:1.0})),
  leaf:[mat(0x4F6B45,{r:.7,x:{flatShading:true}}),mat(0x5E7D51,{r:.7,x:{flatShading:true}}),mat(0x6E8F5F,{r:.7,x:{flatShading:true}})],
  water:mat(0x55524E,{r:.4}), soil:mat(0x4A3A2C), gravel:mat(0xB5AFA4,{r:1}), grass:mat(0x7E9466,{r:1}),
};
M.mc=reg(new THREE.MeshStandardMaterial({color:0xffffff,map:TX.mc,roughness:.9}));
M.grille=(len)=>{const c=TX.grille.clone();c.needsUpdate=true;c.repeat.set(len/0.4,1);const m=reg(new THREE.MeshStandardMaterial({map:c,roughness:.6}));GRILLES.push({m,len});return m;};

function stairs(g,y0,h,mode){
  const n=9, r=h/2/n, L1=CORE.z0+.7, L2=CORE.z1-.7;
  const tread=(x0,x1,zA,zB,base,top)=>{B(g,x1-x0,top-base,Math.abs(zB-zA),M.stone,x0,base,Math.min(zA,zB));B(g,x1-x0,.035,Math.abs(zB-zA)+.02,M.walnut,x0,top-.035,Math.min(zA,zB)-.01);};
  if(mode==='rear'){ // 起跑在後端（1F）
    const len=(CORE.z1-L1)/n;
    for(let i=0;i<n;i++)tread(LX[0],LX[1],CORE.z1-i*len,CORE.z1-(i+1)*len,y0,y0+(i+1)*r);
    B(g,CORE.x1-CORE.x0,h/2,L1-CORE.z0,M.stone,CORE.x0,y0,CORE.z0);B(g,CORE.x1-CORE.x0,.035,L1-CORE.z0,M.walnut,CORE.x0,y0+h/2-.035,CORE.z0);
    for(let i=0;i<n;i++)tread(RX[0],RX[1],L1+i*len,L1+(i+1)*len,y0,y0+h/2+(i+1)*r);
  }else{ // 起跑在前端
    const len=(L2-CORE.z0)/n;
    for(let i=0;i<n;i++)tread(RX[0],RX[1],CORE.z0+i*len,CORE.z0+(i+1)*len,y0,y0+(i+1)*r);
    B(g,CORE.x1-CORE.x0,h/2,CORE.z1-L2,M.stone,CORE.x0,y0,L2);B(g,CORE.x1-CORE.x0,.035,CORE.z1-L2,M.walnut,CORE.x0,y0+h/2-.035,L2);
    for(let i=0;i<n;i++)tread(LX[0],LX[1],L2-i*len,L2-(i+1)*len,y0,y0+h/2+(i+1)*r);
  }
  B(g,.05,h*.5+1,.04,M.black,CORE.x0+.02,y0,CORE.z0+.05).visible=false;
  // 斜向扶手 + 光縫
  const a=new THREE.Vector3(CORE.x0+.03,y0+1.0,-(mode==='rear'?CORE.z1:CORE.z0)), b=new THREE.Vector3(CORE.x0+.03,y0+h/2+1.0,-(mode==='rear'?L1:L2));
  const c2=new THREE.Vector3(CORE.x0+.03,y0+h+1.0,-(mode==='rear'?CORE.z1:CORE.z0));
  for(const [p,q] of [[a,b],[b,c2]]){const len=p.distanceTo(q);const rod=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,len,8),M.black);rod.position.copy(p).lerp(q,.5);rod.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),q.clone().sub(p).normalize());g.add(rod);}
}

function applyArch(st){
  M.plaster.color.set(st.wall);
  const texOf=(k)=>k==='marble'?[TX.marble,1.6,.22]:k==='tile'?[TX.tile,.8,.5]:[TX.oak,1.2,.75];
  const [ft,ftile,fr]=texOf(st.floor[0]);
  for(const f of FLOORS){const t=ft.clone();t.needsUpdate=true;t.repeat.set(f.w/ftile,f.d/ftile);f.m.map=t;f.m.color.set(st.floor[1]);f.m.roughness=fr;f.m.needsUpdate=true;}
  for(const g of GRILLES){let t;if(st.grille[0]==='marble'){t=TX.marble.clone();t.repeat.set(1,1);g.m.roughness=.2;}else{t=(st.grille[0]==='grilleLight'?TX.grilleLight:TX.grille).clone();t.repeat.set(g.len/0.4,1);g.m.roughness=.6;}t.needsUpdate=true;g.m.map=t;g.m.color.set(st.grille[1]);g.m.needsUpdate=true;}
  M.glow.emissive.set(st.glow); for(const l of NIGHT)l.color.set(st.glow);
}
function applyStyle(k){
  const st=STYLES.find(x=>x.k===k)||STYLES[0];
  for(const sl of SLOTS){const pk=st.pick[sl.cat];if(!pk)continue;const o=CAT[sl.cat].find(x=>x.id===pk[0]);if(!o)continue;const c=o.colors.find(x=>x.n===pk[1])||o.colors[0];state[sl.id]={o:o.id,c:c.n};}
  state.__style=st.k; save(); applyArch(st);
  for(const sl of SLOTS)if(!sl.follow)place(sl.id); for(const sl of SLOTS)if(sl.follow)place(sl.id);
  renderSheet();
}
applyArch(STYLES.find(x=>x.k===state.__style)||STYLES[0]);

function brandTag(b){return `<span class="brand ${b==='IKEA'?'b-ikea':b==='特力屋'?'b-tr':'b-gen'}">${b}</span>`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderSheet(){
  if(editing){renderEditor(editing);return;}
  const f=curFloor==='all'?null:Number(curFloor);
  const list=SLOTS.filter(s=>!f||s.f===f);
  title.textContent=f?`${f}F 家具搭配`:'全棟家具搭配';
  const curSt=state.__style||'warm';
  let html=`<div class="sect"><h2>風格方案（套用全棟）</h2><div class="themes">${STYLES.map(t=>`<button class="theme" data-style="${t.k}" aria-pressed="${t.k===curSt}"><span>${t.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</span><b class="tn">${t.n}</b><small>${t.d}</small></button>`).join('')}</div><p class="tip">套用後仍可逐件更換款式與顏色。</p></div>`;
  html+=`<div class="sect"><h2>${f?'這層的家具':'全部家具'}（點選更換款式與顏色）</h2><div class="list">`;
  for(const s of list){const {o,col}=sel(s.id);html+=`<button class="item" data-slot="${s.id}"><span class="dot" style="background:${col.hex}"></span><span style="min-width:0"><span class="iname">${esc(s.label)}</span> <span class="iroom">${esc(s.room)}</span><br><span class="isub">${o.brand}｜${esc(o.name)}・${esc(col.n)}</span></span><span aria-hidden="true">›</span></button>`;}
  html+='</div></div>';
  body.innerHTML=html;
  body.querySelectorAll('.item').forEach(b=>b.onclick=()=>openEditor(b.dataset.slot));
  body.querySelectorAll('.theme').forEach(b=>b.onclick=()=>applyStyle(b.dataset.style));
}
function applyTheme(k,f){
  for(const s of SLOTS){if(f&&s.f!==f)continue;const {o}=sel(s.id);const c=o.colors.find(x=>x.tone===k);if(c){state[s.id]={o:o.id,c:c.n};}}
  save();for(const s of SLOTS)if(!s.follow&&(!f||s.f===f))place(s.id);renderSheet();
}
function openEditor(id){setSheet(true);editing=id;renderEditor(id);const s=SLOT[id];
  const g=OBJ[id]; if(g){const box=new THREE.Box3().setFromObject(g);const c=box.getCenter(new THREE.Vector3());highlight(g);
    if(curFloor==='all'||Number(curFloor)!==s.f){const v=VIEWS.find(x=>x.f===s.f&&!x.in);goView(v);} }}
function searchUrl(site,q){return 'https://www.google.com/search?q='+encodeURIComponent(`site:${site} ${q}`);}
function renderEditor(id){
  const s=SLOT[id], list=CAT[s.cat], {o,col}=sel(id);
  title.textContent=`${s.room}・${s.label}`;
  let fit='';
  const wM=o.w/100;
  if(s.avail){const left=Math.round((s.avail-wM)*100);fit=left>=0?`<div class="fit ok"><b>✓ 放得下</b>　寬 ${o.w} cm，這個位置可用約 ${Math.round(s.avail*100)} cm，左右還有 ${left} cm。</div>`:`<div class="fit warn"><b>⚠ 太寬了</b>　寬 ${o.w} cm，這個位置只有約 ${Math.round(s.avail*100)} cm，超出 ${-left} cm。</div>`;}
  if(s.availD&&o.d/100>s.availD)fit+=`<div class="fit warn"><b>⚠ 偏深</b>　深 ${o.d} cm，建議 ${Math.round(s.availD*100)} cm 以內，床尾走道會變窄。</div>`;
  if(id==='f2-sofa'){const eye=(W-.1)-o.d/100+.4;const dist=(eye-.2).toFixed(1);fit+=`<div class="fit ok"><b>觀看距離 約 ${dist} m</b>　85 吋電視建議 2.6–3.8 m。</div>`;}
  const other=o.brand==='IKEA'?'trplus.com.tw':'ikea.com.tw';
  body.innerHTML=`<div class="editor">
   <button class="back" id="back">‹ 回到家具列表</button>
   <div class="sect"><h2>款式</h2><div class="opts">${list.map(x=>`<button class="opt" data-o="${x.id}" aria-pressed="${x.id===o.id}"><span class="on">${brandTag(x.brand)}${esc(x.name)}</span><span class="os">參考尺寸 寬 ${x.w} × 深 ${x.d} × 高 ${x.h} cm${x.ext?`（可延伸至 ${x.ext}）`:''}</span></button>`).join('')}</div></div>
   <div class="sect"><h2>顏色</h2><div class="swatches">${o.colors.map(c=>`<button class="sw" data-c="${esc(c.n)}" aria-pressed="${c.n===col.n}"><i style="background:${c.hex}"></i>${esc(c.n)}</button>`).join('')}</div></div>
   ${fit}
   ${s.tip?`<p class="tip">${esc(s.tip)}</p>`:''}
   <div class="sect"><h2>去官網看實品</h2><div class="links">
     ${o.brand==='家電'?`<a href="https://www.google.com/search?q=${encodeURIComponent(o.q)}" target="_blank" rel="noopener">搜尋「${esc(o.q)}」</a><a href="${searchUrl('ikea.com.tw','電視 壁掛架')}" target="_blank" rel="noopener">IKEA 壁掛架／電視櫃</a>`:
     `<a href="${searchUrl(o.brand==='IKEA'?'ikea.com.tw':'trplus.com.tw',o.q)}" target="_blank" rel="noopener">在${o.brand==='IKEA'?' IKEA ':'特力屋'}找「${esc(o.q)}」</a>
     <a href="${searchUrl(other,s.label+' '+col.n)}" target="_blank" rel="noopener">到${o.brand==='IKEA'?'特力屋':' IKEA '}找類似款</a>`}
   </div></div>
   <p class="tip">尺寸、顏色名稱為參考，實際款式與價格以官網為準。</p>
  </div>`;
  body.querySelector('#back').onclick=()=>{editing=null;clearHL();renderSheet();};
  body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const no=list.find(x=>x.id===b.dataset.o);const keep=no.colors.find(c=>c.n===col.n)||no.colors.find(c=>c.tone===col.tone)||no.colors[0];state[id]={o:no.id,c:keep.n};save();place(id);highlight(OBJ[id]);renderEditor(id);});
  body.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{state[id]={o:o.id,c:b.dataset.c};save();place(id);highlight(OBJ[id]);renderEditor(id);});
}
let hl=null;
function highlight(g){clearHL();if(!g)return;hl=new THREE.BoxHelper(g,0xF0B66A);hl.material.depthTest=false;hl.renderOrder=10;scene.add(hl);}
function clearHL(){if(hl){scene.remove(hl);hl=null;}}

/* 點選 3D 家具 */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);
  const vis=PICK.filter(g=>FL[SLOT[g.userData.slot].f].visible);const hit=ray.intersectObjects(vis,true).find(h=>!clipOn||h.point.y<clipPlane.constant);
  if(hit){let o=hit.object;while(o&&!o.userData.slot)o=o.parent;if(o)openEditor(o.userData.slot);}});

const dlg=document.getElementById('dlg');
document.getElementById('btnList').onclick=()=>{const lines=[];let room='';for(const s of SLOTS.slice().sort((a,b)=>a.f-b.f)){const {o,col}=sel(s.id);if(s.room!==room){room=s.room;lines.push(`\n【${room}】`);}lines.push(`・${s.label}：${o.brand} ${o.name}（${col.n}，約 ${o.w}×${o.d}×${o.h} cm）`);}

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);labelR.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
function frame(t){
  if(tween.a){const a=tween.a;let k=Math.min(1,(t-a.s)/a.d);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;camera.position.lerpVectors(a.p0,a.p1,k);controls.target.lerpVectors(a.t0,a.t1,k);if(k>=1)tween.a=null;}
  controls.update(); if(hl)hl.update(); renderer.render(scene,camera); labelR.render(scene,camera); requestAnimationFrame(frame);
}
goView(VIEWS[0],true);
document.getElementById('loading').hidden=true;
requestAnimationFrame(frame);
window.__house={obj:OBJ,style:(k)=>applyStyle(k),go:(n)=>goView(VIEWS.find(v=>v.n===n),true),night:(on)=>{night=on;setNight();},ready:true};
